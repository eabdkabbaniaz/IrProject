<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الخيارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #1f1c2c, #928dab);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .choice-box {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .btn-custom {
            background: #605cb1;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            width: 100%;
        }

        .btn-custom:hover {
            background: linear-gradient(to right, #48c6ef, #6c63ff);
        }
    </style>
</head>
<body>
    <div class="choice-box">
        <h2 class="mb-4">اختر نوع الطلب</h2>
        <a href="/basic" class="btn btn-custom">Basic Requirments</a>
        <a href="/additional" class="btn btn-custom">Advanced Query</a>
        <a href="/additional2" class="btn btn-custom">BM25 & hybird parallel</a>
    </div>
</body>
</html>
